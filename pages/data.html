<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favoriler | Yunus Barış</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#111;color:#fff;font-family:Arial,sans-serif;min-height:100vh}
    header{background:#181818;border-bottom:1px solid #333}
    nav,main{max-width:1100px;margin:auto;padding:20px}
    nav{display:flex;justify-content:space-between;align-items:center;gap:16px}
    a{color:inherit}.logo{text-decoration:none;font-size:22px;font-weight:800}.logo span,.highlight{color:#e63946}
    .favorite-summary{background:rgba(230,57,70,.14);border:1px solid rgba(230,57,70,.45);border-radius:999px;padding:10px 16px;font-weight:700}
    .page-header{margin:28px 0}.page-header h1{font-size:clamp(34px,7vw,68px)}.page-header p{color:#bbb;line-height:1.6;max-width:760px;margin-top:10px}
    .projects-grid,.favorites-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
    .project-card{position:relative;background:#181818;border:1px solid #333;border-radius:8px;padding:26px;min-height:280px}
    .favorite-btn{position:absolute;top:16px;right:16px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(230,57,70,.45);background:rgba(230,57,70,.12);color:#e63946;cursor:pointer}
    .favorite-btn.active{background:#e63946;color:#fff}
    .project-icon{width:54px;height:54px;display:flex;align-items:center;justify-content:center;background:rgba(230,57,70,.12);color:#e63946;border-radius:8px;font-size:24px;margin-bottom:18px}
    .project-card h3{font-size:22px;margin-bottom:12px;max-width:calc(100% - 48px)}
    .project-card p{color:#bbb;line-height:1.55}.tech-list{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
    .tech-list span{border:1px solid #333;border-radius:999px;padding:7px 10px;color:#ccc;font-size:13px}
    .project-link{color:#e63946;font-weight:700;text-decoration:none}.favorites-section{border-top:1px solid #333;margin-top:50px;padding-top:30px}
    .section-title-row{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px}
    .clear-btn{border:1px solid rgba(230,57,70,.45);border-radius:999px;background:transparent;color:#e63946;padding:10px 14px;cursor:pointer;font-weight:700}
    .empty-message,.status-message{border:1px dashed #444;border-radius:8px;color:#bbb;padding:28px;text-align:center}
    .toast{position:fixed;right:20px;bottom:20px;background:#e63946;color:#fff;border-radius:8px;padding:14px 18px;opacity:0;transform:translateY(16px);transition:.25s}
    .toast.show{opacity:1;transform:translateY(0)}
  </style>
</head>
<body>
  <header>
   <nav>
  <a class="logo" href="../index.html">YB<span>.</span></a>
  <div class="favorite-summary"><i class="fas fa-heart"></i> Favoriler: <span id="favorite-count">0</span></div>
</nav>
  </header>
  <main>
    <section class="page-header">
      <h1>Veri <span class="highlight">Odevim</span></h1>
      <p>Bu sayfada proje verileri JSON dosyasindan okunur, JavaScript ile kartlara donusturulur. Favoriler localStorage ve Firebase Realtime Database ile saklanir.</p>
    </section>
    <div id="projects-grid" class="projects-grid"><div class="status-message">Projeler yukleniyor...</div></div>
    <section class="favorites-section">
      <div class="section-title-row">
        <h2>Favori Projelerim</h2>
        <button class="clear-btn" type="button" data-clear-favorites><i class="fas fa-trash"></i> Tum Favorileri Sil</button>
      </div>
      <div id="favorites-container"><div class="empty-message">Henuz favorilere proje eklemediniz.</div></div>
    </section>
  </main>
  <div id="toast" class="toast"></div>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script>
    const projectsGrid=document.getElementById("projects-grid"),favoritesContainer=document.getElementById("favorites-container"),favoriteCount=document.getElementById("favorite-count"),toast=document.getElementById("toast");
    const storageKey="projectFavorites",clientKey="portfolioClientId";
    const firebaseConfig={apiKey:"AIzaSyBAF6gV5hL5l1GkvgXSX481sFV90-UBf8w",authDomain:"web-portfolio-odev.firebaseapp.com",databaseURL:"https://web-portfolio-odev-default-rtdb.firebaseio.com",projectId:"web-portfolio-odev",storageBucket:"web-portfolio-odev.firebasestorage.app",messagingSenderId:"675622159036",appId:"1:675622159036:web:d29f8079123b4aa6e446b9"};
    let projects=[],favorites=[],favoritesRef=null;
    try{favorites=JSON.parse(localStorage.getItem(storageKey))||[]}catch(e){favorites=[];localStorage.removeItem(storageKey)}
    function showToast(msg){toast.textContent=msg;toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),2500)}
    function getClientId(){let id=localStorage.getItem(clientKey);if(!id){id=`visitor-${Date.now()}-${Math.floor(Math.random()*100000)}`;localStorage.setItem(clientKey,id)}return id}
    function saveFavorites(){localStorage.setItem(storageKey,JSON.stringify(favorites));if(favoritesRef)favoritesRef.set({items:favorites,updatedAt:new Date().toISOString()})}
    function connectFirebase(){if(!window.firebase)return showToast("Firebase yuklenemedi, localStorage kullaniliyor.");firebase.initializeApp(firebaseConfig);favoritesRef=firebase.database().ref(`favoriteUsers/${getClientId()}/favorites`);favoritesRef.once("value").then(s=>{const d=s.val();if(d&&Array.isArray(d.items)){favorites=d.items;localStorage.setItem(storageKey,JSON.stringify(favorites));refreshUI()}else saveFavorites()})}
    function isFavorite(id){return favorites.includes(id)}
    function createProjectCard(project,isFavoriteList=false){const card=document.createElement("article");card.className="project-card";const active=isFavorite(project.id)?"active":"",heart=isFavorite(project.id)?"fas fa-heart":"far fa-heart",techs=project.technologies.map(t=>`<span>${t}</span>`).join(""),btn=isFavoriteList?"":`<button class="favorite-btn ${active}" type="button"><i class="${heart}"></i></button>`;card.innerHTML=`${btn}<div class="project-icon"><i class="fas ${project.icon}"></i></div><h3>${project.title}</h3><p>${project.description}</p><div class="tech-list">${techs}</div><a class="project-link" href="${project.link}" target="_blank">GitHub'da Gor <i class="fas fa-arrow-right"></i></a>`;const b=card.querySelector(".favorite-btn");if(b)b.addEventListener("click",()=>toggleFavorite(project.id));return card}
    function renderProjects(){projectsGrid.innerHTML="";projects.forEach(p=>projectsGrid.appendChild(createProjectCard(p)))}
    function renderFavorites(){favoriteCount.textContent=favorites.length;favoritesContainer.innerHTML="";const favs=projects.filter(p=>isFavorite(p.id));if(!favs.length){favoritesContainer.innerHTML='<div class="empty-message">Henuz favorilere proje eklemediniz.</div>';return}const grid=document.createElement("div");grid.className="favorites-grid";favs.forEach(p=>grid.appendChild(createProjectCard(p,true)));favoritesContainer.appendChild(grid)}
    function refreshUI(){renderProjects();renderFavorites()}
    function toggleFavorite(id){const p=projects.find(x=>x.id===id);if(isFavorite(id)){favorites=favorites.filter(x=>x!==id);showToast(`${p.title} favorilerden cikarildi.`)}else{favorites.push(id);showToast(`${p.title} favorilere eklendi.`)}saveFavorites();refreshUI()}
    function clearAllFavorites(){favorites=[];localStorage.removeItem(storageKey);if(favoritesRef)favoritesRef.remove();refreshUI();showToast("Tum favoriler temizlendi.")}
    document.addEventListener("click",e=>{if(e.target.closest("[data-clear-favorites]"))clearAllFavorites()});
    async function loadProjects(){try{const r=await fetch("../assets/data/projects.json");if(!r.ok)throw new Error("JSON dosyasi okunamadi.");projects=await r.json();refreshUI()}catch(e){projectsGrid.innerHTML=`<div class="status-message">${e.message}</div>`}}
    connectFirebase();loadProjects();
  </script>
</body>
</html>
