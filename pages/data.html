<html lang="tr">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veri Odevim</title>

      align-items: center;
      justify-content: space-between;

    }

      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
    }
