<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favoriler | Yunus Barış</title>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        .data-toolbar {
            display: grid;
            grid-template-columns: minmax(220px, 2fr) minmax(160px, 1fr) minmax(160px, 1fr);
            gap: 14px;
            margin: 0 0 34px;
        }
        .data-toolbar input,
        .data-toolbar select {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            border-radius: 8px;
            padding: 14px 16px;
            font-family: inherit;
            outline: none;
        }
        .data-toolbar select option {
            background: #141414;
            color: #fff;
        }
        .data-toolbar input:focus,
        .data-toolbar select:focus {
            border-color: #e63946;
            box-shadow: 0 0 0 3px rgba(230, 57, 70, 0.15);
        }
        .project-card {
            position: relative;
        }
        .favorite-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            background: rgba(230, 57, 70, 0.15);
            border: 2px solid rgba(230, 57, 70, 0.3);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: #e63946;
            transition: all 0.3s ease;
            z-index: 10;
            font-family: inherit;
        }
        .favorite-btn:hover {
            background: rgba(230, 57, 70, 0.25);
            border-color: #e63946;
            transform: scale(1.1);
        }
        .favorite-btn.active {
            background: #e63946;
            color: #fff;
            box-shadow: 0 0 20px rgba(230, 57, 70, 0.6);
        }
        .project-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 18px 0 0;            <button id="close-chat"><i class="fas fa-times"></i></button>
        </div>
        <div id="ai-chat-body">
            <div class="ai-message">Merhaba! Ben Yunus'un AI asistanıyım. Size nasıl yardımcı olabilirim?</div>
        </div>
        <div class="ai-chat-footer">
            <input type="text" id="ai-input" placeholder="Bir şeyler sorun...">
            <button id="send-ai" style="background:#e63946;border:none;color:#fff;padding:12px 18px;border-radius:50px;cursor:pointer;font-family:inherit;"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
    <button id="ai-chat-toggle"><i class="fas fa-robot"></i></button>
    <footer><p>&copy; 2026 Yunus Barış. Tüm Hakları Saklıdır.</p></footer>
    <div id="toast" class="toast"></div>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
    <script src="../assets/js/app.js"></script>
    <script>
        const fallbackProjects=[
            {id:1,title:"E-Ticaret Sitesi",description:"PHP ve MySQL kullanılarak geliştirilmiş, dinamik sepet sistemi ve yönetici paneli bulunan kapsamlı bir e-ticaret platformu.",category:"Web",icon:"fa-shopping-cart",link:"https://github.com/barisyunus29-blip",technologies:["PHP","MySQL","JavaScript"]},
            {id:2,title:"Stok Takip Sistemi",description:"C# ve SQL Server tabanlı, işletmelerin ürün stoklarını, satışlarını ve raporlarını yönetebileceği masaüstü uygulaması.",category:"Masaüstü",icon:"fa-desktop",link:"https://github.com/barisyunus29-blip",technologies:["C#","SQL Server","Windows Forms"]},
            {id:3,title:"Hava Durumu Uygulaması",description:"OpenWeather API kullanarak anlık hava durumu verilerini modern bir arayüzle sunan JavaScript tabanlı web uygulaması.",category:"API",icon:"fa-cloud-sun",link:"https://github.com/barisyunus29-blip",technologies:["JavaScript","API","CSS"]},
            {id:4,title:"Görev Yönetim Aracı",description:"Kullanıcıların günlük işlerini planlayabileceği, tamamlanan görevleri takip edebileceği ve localStorage destekli modern bir ajanda.",category:"Üretkenlik",icon:"fa-tasks",link:"https://github.com/barisyunus29-blip",technologies:["JavaScript","localStorage","HTML"]}
        ];
        const projectsGrid=document.getElementById("projects-grid");
        const favoritesContainer=document.getElementById("favorites-container");
        const favoritesCount=document.getElementById("favorites-count");
        const searchInput=document.getElementById("search-input");
        const categoryFilter=document.getElementById("category-filter");
        const sortSelect=document.getElementById("sort-select");
        const clearFavoritesBtn=document.getElementById("clear-favorites-btn");
        const toast=document.getElementById("toast");
        const storageKey="projectFavorites";
        const clientKey="portfolioClientId";
        const firebaseConfig={apiKey:"AIzaSyBAF6gV5hL5l1GkvgXSX481sFV90-UBf8w",authDomain:"web-portfolio-odev.firebaseapp.com",databaseURL:"https://web-portfolio-odev-default-rtdb.firebaseio.com",projectId:"web-portfolio-odev",storageBucket:"web-portfolio-odev.firebasestorage.app",messagingSenderId:"675622159036",appId:"1:675622159036:web:d29f8079123b4aa6e446b9"};
        let projects=[];
        let favorites=loadLocalFavorites();
        let favoritesRef=null;
        function loadLocalFavorites(){try{return JSON.parse(localStorage.getItem(storageKey))||[]}catch(e){localStorage.removeItem(storageKey);return[]}}
        function showToast(message){toast.textContent=message;toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),2600)}
        function getClientId(){let id=localStorage.getItem(clientKey);if(!id){id=`visitor-${Date.now()}-${Math.floor(Math.random()*100000)}`;localStorage.setItem(clientKey,id)}return id}
        function normalizeText(value){return String(value||"").toLocaleLowerCase("tr-TR")}
        function isFavorite(projectId){return favorites.includes(projectId)}
        function saveFavorites(){localStorage.setItem(storageKey,JSON.stringify(favorites));if(favoritesRef)favoritesRef.set({items:favorites,updatedAt:new Date().toISOString()})}
        function connectFirebase(){
            if(!window.firebase)return;
            try{
                firebase.initializeApp(firebaseConfig);
                favoritesRef=firebase.database().ref(`favoriteUsers/${getClientId()}/favorites`);
                favoritesRef.once("value").then(snapshot=>{
                    const data=snapshot.val();
                    if(data&&Array.isArray(data.items)&&data.items.length>0){
                        favorites=[...new Set([...favorites,...data.items])];
                        localStorage.setItem(storageKey,JSON.stringify(favorites));
                        refreshUI();
                    }else saveFavorites();
                });
            }catch(e){favoritesRef=null}
        }
        function getFilteredProjects(){
            const term=normalizeText(searchInput.value);
            const category=categoryFilter.value;
            return projects.filter(project=>{
                const text=normalizeText(`${project.title} ${project.description} ${(project.technologies||[]).join(" ")} ${project.category}`);
                return text.includes(term)&&(category==="all"||project.category===category);
            }).sort((a,b)=>sortSelect.value==="name-desc"?b.title.localeCompare(a.title,"tr"):a.title.localeCompare(b.title,"tr"));
        }
        function createProjectCard(project){
            const card=document.createElement("div");
            card.className="project-card glow-card";
            card.dataset.projectId=project.id;
            const active=isFavorite(project.id);
            const techs=(project.technologies||[]).map(tech=>`<span>${tech}</span>`).join("");
            card.innerHTML=`
                <button class="favorite-btn ${active?"active":""}" type="button" title="${active?"Favorilerden Çıkar":"Favorilere Ekle"}">
                    <i class="${active?"fas":"far"} fa-heart"></i>
                </button>
                <a href="${project.link}" target="_blank" rel="noopener" class="project-link">
                    <div class="project-icon"><i class="fas ${project.icon}"></i></div>
                    <span class="category-badge">${project.category||"Proje"}</span>
                    <h3>${project.title}</h3>
                    <p>${project.description}</p>
                    <div class="project-meta">${techs}</div>
                    <div class="project-link-hint"><span>GitHub'da Görüntüle</span><i class="fas fa-arrow-right"></i></div>
                </a>`;
            card.querySelector(".favorite-btn").addEventListener("click",event=>{event.preventDefault();event.stopPropagation();toggleFavorite(project.id)});
            return card;
        }
        function renderProjects(){
            const filtered=getFilteredProjects();
            projectsGrid.innerHTML="";
            if(!filtered.length){projectsGrid.innerHTML='<div class="empty-message">Aramanıza uygun proje bulunamadı.</div>';return}
            filtered.forEach(project=>projectsGrid.appendChild(createProjectCard(project)));
        }
        function renderFavorites(){
            const favoriteProjects=projects.filter(project=>isFavorite(project.id));
            favoritesCount.textContent=favoriteProjects.length;
            favoritesContainer.innerHTML="";
            if(!favoriteProjects.length){
                favoritesContainer.innerHTML='<div class="empty-message">Projeler sayfasında veya burada kalbe tıklayınca favoriler burada görünecek.</div>';
                clearFavoritesBtn.style.display="none";
                return;
            }
            favoriteProjects.forEach(project=>favoritesContainer.appendChild(createProjectCard(project)));
            clearFavoritesBtn.style.display="inline-flex";
        }
        function refreshUI(){renderProjects();renderFavorites()}
        function toggleFavorite(projectId){
            const project=projects.find(item=>item.id===projectId);
            if(isFavorite(projectId)){favorites=favorites.filter(id=>id!==projectId);showToast(`${project.title} favorilerden çıkarıldı.`)}
            else{favorites.push(projectId);showToast(`${project.title} favorilere eklendi.`)}
            saveFavorites();
            refreshUI();
        }
        function clearAllFavorites(){favorites=[];localStorage.removeItem(storageKey);if(favoritesRef)favoritesRef.remove();refreshUI();showToast("Tüm favoriler temizlendi.")}
        function populateCategories(){
            categoryFilter.querySelectorAll("option:not([value='all'])").forEach(option=>option.remove());
            [...new Set(projects.map(project=>project.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"tr")).forEach(category=>{
                const option=document.createElement("option");
                option.value=category;
                option.textContent=category;
                categoryFilter.appendChild(option);
            });
        }
        async function loadProjects(){
            try{
                const response=await fetch("../assets/data/projects.json");
                if(!response.ok)throw new Error("JSON dosyası okunamadı.");
                projects=await response.json();
            }catch(e){
                projects=fallbackProjects;
                showToast("JSON okunamadı, yedek proje listesi gösteriliyor.");
            }
            populateCategories();
            refreshUI();
        }
        [searchInput,categoryFilter,sortSelect].forEach(element=>{
            element.addEventListener("input",renderProjects);
            element.addEventListener("change",renderProjects);
        });
        clearFavoritesBtn.addEventListener("click",clearAllFavorites);
        loadProjects();
        connectFirebase();
    </script>
</body>
</html>
        }
        .project-meta span {
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 50px;
            padding: 7px 10px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.78rem;
        }
        .category-badge {
            display: inline-flex;
            width: fit-content;
            margin: 0 0 12px;
            border: 1px solid rgba(230, 57, 70, 0.45);
            border-radius: 50px;
